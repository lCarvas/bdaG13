[project]
name = "bda-g13"
version = "0.1.0"
description = "A project for the Big Data Analytics course in the Masters in Data Science and Advanced Analytics program at NOVA IMS."
authors = [
  { name = "Beatris Daicu", email = "20221854@novaims.unl.pt" },
  { name = "Diogo Carvalho", email = "20221935@novaims.unl.pt" },
  { name = "Ricardo Pereira", email = "20250343@novaims.unl.pt" },
  { name = "Yehor Malakhov", email = "20221691@novaims.unl.pt" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "graphframes-py==0.11.0",
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.8",
  "matplotlib>=3.10.8",
  "nbformat>=5.10.4",
  "networkx>=3.6.1",
  "pandas>=3.0.3",
  "plotly>=6.6.0",
  "pyarrow>=23.0.1",
  "pyod>=3.2.1",
  "pyspark>=4.1.1",
  "scikit-learn>=1.8.0",
  "seaborn>=0.13.2",
  "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",
  "FIX",
  "COM812",
  "D100",
  "D104",
  "E501",
  'ERA001',
  "S101",
  "TD003",
  "TRY003",
  "T201",
  "W505",
  "PTH",
  "EM101",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
